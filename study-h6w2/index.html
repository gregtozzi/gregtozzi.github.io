<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Study Reviews</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: graph-paper page, one column, a labeled list of review links per subject. To add a review, copy one <li> into the right subject. */
:root{
  --bg:#F2F5FA; --grid:#DCE5F1; --card:#FFFFFF; --ink:#16213D; --muted:#55657F; --line:#C9D5E5; --accent:#2457D6;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1726; --grid:#18243B; --card:#172236; --ink:#E8EEF8; --muted:#9BACC6; --line:#2B3B58; --accent:#7AA2FF; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1726; --grid:#18243B; --card:#172236; --ink:#E8EEF8; --muted:#9BACC6; --line:#2B3B58; --accent:#7AA2FF; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-size:clamp(32px,8vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.rev{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);color:inherit;text-decoration:none;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:64px}
a.rev:hover{border-color:var(--accent)}
a.rev:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.t{display:flex;flex-direction:column;min-width:0}
.t b{font-size:20px;font-weight:700}
.t span{color:var(--muted);font-size:16px}
.go{flex:none;color:var(--accent);font-weight:700;font-size:22px}
</style></head>
<body>
<main>
  <header>
    <h1>Study reviews</h1>
    <p class="sub">Pick a subject, then a review.</p>
  </header>

  <section aria-labelledby="s-fr">
    <h2 id="s-fr">French I</h2>
    <ul>
      <li><a class="rev" href="/fr-ch4-m8x3/"><span class="t"><b>Chapitre 4 Révision</b><span>Vocabulary, flashcards, and a mock test</span></span><span class="go" aria-hidden="true">→</span></a></li>
      <li><a class="rev" href="/fr-ch3-k7q2/"><span class="t"><b>Chapitre 3 Révision</b><span>Vocabulary, verbs, and a mock test</span></span><span class="go" aria-hidden="true">→</span></a></li>
    </ul>
  </section>

  <section aria-labelledby="s-ps">
    <h2 id="s-ps">Physical Science</h2>
    <ul>
      <li><a class="rev" href="/motion-forces-t5n2/"><span class="t"><b>Motion and Forces</b><span>Step-by-step problems, formula and concept drills, word problems</span></span><span class="go" aria-hidden="true">→</span></a></li>
    </ul>
  </section>
</main>
</body></html>
