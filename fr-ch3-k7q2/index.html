function frVars(fr){const o=new Set();fr.split(/\s*\/\s*/).forEach(p=>{const m=p.match(/^(.*?)\s*\((.*)\)$/);(m?[m[1],m[2]]:[p]).forEach(x=>{o.add(x);o.add(x.replace(/^(un|une|le|la|les|des)\s+|^l'/i,''))})});return [...o].filter(Boolean)}

P.weak=()=>{const m=S.misses;view().innerHTML=`${head('À revoir',m.length?m.length+' to review':'Nothing to review','Every question you miss lands here. Answer it correctly once to clear it.')}${m.length?`<div class="card"><div class="row"><button class="btn" id="go">Practice my misses</button><button class="btn ghost" id="clr">Clear list</button></div></div><div class="card scroll"><table><tr><th>Question</th><th>Answer</th></tr>${m.slice(0,30).map(q=>`<tr><td>${fmt(q.prompt)}</td><td><b>${esc(ansText(q))}</b></td></tr>`).join('')}</table></div>`:''}`;
 if(m.length){$('#go').onclick=()=>runQuiz({title:'À revoir',qs:shuffle(m).slice(0,20),back:P.weak});$('#clr').onclick=()=>{S.misses=[];save();P.weak();badge()}}};
function route(){document.onkeydown=null;const h=(location.hash||'#home').slice(1);(P[h]||P.home)();badge();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
