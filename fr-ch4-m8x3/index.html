function flash(deck,back){let i=0,got=0,again=[],tf=0;const v=view();
 function show(){if(i>=deck.length){v.innerHTML=`<div class="card"><div class="eyebrow">Flashcards</div><div class="big">${got}/${deck.length}</div><p class="lead">Got it: ${got}. Again: ${again.length}.</p><div class="row">${again.length?'<button class="btn" id="re">Study the ones I missed</button>':''}<button class="btn ghost" id="bk">Back</button></div></div>`;$('#bk').onclick=back;if(again.length)$('#re').onclick=()=>flash(again,back);document.onkeydown=null;return}
  tf=Date.now();const it=deck[i],fe=vdir==='ef'?false:vdir==='mix'?(it.id.length%2===0):true;const front=fe?it[0]:it[1],backT=fe?it[1]:it[0];let flipped=false;
  v.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn ghost" id="bk" style="min-height:36px;padding:4px 12px">Quit</button><span>${i+1} / ${deck.length}</span></div><div class="bar"><i style="width:${100*i/deck.length}%"></i></div><div class="fc" id="fc" tabindex="0" role="button" aria-label="Flip card"><small id="lb">${fe?'Français':'English'}</small><div class="bigw" id="tx" style="${fe?'':'font-family:var(--fd);font-weight:800'}">${esc(front)}</div></div><div class="row" id="ctl" style="justify-content:center"><span style="color:var(--ink2)">Tap the card or press Space to flip</span></div>`;
  $('#bk').onclick=()=>{document.onkeydown=null;back()};
  const flip=()=>{if(flipped)return;flipped=true;$('#lb').textContent=fe?'English':'Français';$('#tx').textContent=backT;$('#tx').style.cssText=fe?'font-family:var(--fd);font-weight:800':'';if(it[3])$('#tx').insertAdjacentHTML('afterend',`<small style="color:var(--red);text-transform:none;font-size:14px">${esc(it[3])}</small>`);say(it[0]);
   $('#ctl').innerHTML=`<button class="btn ghost" id="ag">Again (1)</button><button class="btn good" id="gt">Got it (2)</button><button class="sp" id="sy" aria-label="Listen">${SPK}</button>`;$('#sy').onclick=()=>say(it[0]);
   const mv=ok=>{boxUp(it.id,ok);logEvent({tp:'vocab',qt:'flash',m:'flash',q:it[0],a:it[1],r:'',ok:ok?1:0,ms:Date.now()-tf,v:it.id});if(ok)got++;else again.push(it);save();i++;show()};$('#ag').onclick=()=>mv(false);$('#gt').onclick=()=>mv(true)};
  $('#fc').onclick=flip;document.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}else if(flipped&&e.key==='1')$('#ag').click();else if(flipped&&e.key==='2')$('#gt').click()}}
 show()}

P.avoir=()=>{view().innerHTML=`${head('Grammaire','Avoir, être et il y a','The most useful irregular verb: possession, age, and many expressions.')}
 <details open><summary>Learn it</summary><div><div class="grid"><div class="scroll"><table><tr><th colspan="2">avoir (to have)</th></tr><tr><td>j’</td><td><b>ai</b></td></tr><tr><td>tu</td><td><b>as</b></td></tr><tr><td>il / elle / on</td><td><b>a</b></td></tr><tr><td>nous</td><td><b>avons</b></td></tr><tr><td>vous</td><td><b>avez</b></td></tr><tr><td>ils / elles</td><td><b>ont</b></td></tr></table></div><div class="scroll"><table><tr><th colspan="2">être (to be) · review</th></tr><tr><td>je</td><td><b>suis</b></td></tr><tr><td>tu</td><td><b>es</b></td></tr><tr><td>il / elle / on</td><td><b>est</b></td></tr><tr><td>nous</td><td><b>sommes</b></td></tr><tr><td>vous</td><td><b>êtes</b></td></tr><tr><td>ils / elles</td><td><b>sont</b></td></tr></table></div></div>
 <ul class="facts"><li><b>Age uses avoir:</b> <i>Tu as quel âge ? J’ai quinze ans.</i> (Not “je suis quinze ans”.)</li><li><b>Il y a</b> = there is / there are: <i>Il y a un jardin autour de la maison.</i> Negative: <i>Il n’y a pas de fleurs.</i></li><li><b>Negative:</b> un / une / des → <mark>de / d’</mark>: <i>Marc n’a pas de sœur. Je n’ai pas d’ordinateur.</i></li><li><b>Liaison:</b> nous_z avons, vous_z avez, ils_z ont.</li><li><b>Expressions with avoir</b> (English uses “to be”): avoir faim (hungry), soif (thirsty), chaud (hot), froid (cold), sommeil (sleepy), raison (right), tort (wrong), honte (ashamed), mal à (hurt); avoir besoin de (to need), avoir envie de (to want to), avoir l’intention de (to intend to).</li></ul></div></details>

 <div class="scroll"><table><tr><th>Adjective</th><th>m. + consonant</th><th>m. + vowel</th><th>feminine</th><th>m. pl.</th><th>f. pl.</th></tr>${r('beautiful','un <b>beau</b> quartier','un <b>bel</b> appartement','une <b>belle</b> maison','de <b>beaux</b> quartiers','de <b>belles</b> maisons')}${r('new','un <b>nouveau</b> sac','un <b>nouvel</b> ami','une <b>nouvelle</b> voiture','de <b>nouveaux</b> sacs','de <b>nouvelles</b> voitures')}${r('old','un <b>vieux</b> garçon','un <b>vieil</b> immeuble','une <b>vieille</b> maison','de <b>vieux</b> garçons','de <b>vieilles</b> maisons')}${r('good','un <b>bon</b> garçon','un <b>bon</b> ami','une <b>bonne</b> fille','de <b>bons</b> garçons','de <b>bonnes</b> filles')}${r('small','un <b>petit</b> garçon','un <b>petit</b> ami','une <b>petite</b> fille','de <b>petits</b> garçons','de <b>petites</b> filles')}</table></div>

P.weak=()=>{const m=S.misses;view().innerHTML=`${head('À revoir',m.length?m.length+' to review':'Nothing to review','Every question you miss lands here. Answer it correctly once to clear it.')}${m.length?`<div class="card"><div class="row"><button class="btn" id="go">Practice my misses</button><button class="btn ghost" id="clr">Clear list</button></div></div><div class="card scroll"><table><tr><th>Question</th><th>Answer</th></tr>${m.slice(0,30).map(q=>`<tr><td>${fmt(q.prompt)}</td><td><b>${esc(ansText(q))}</b></td></tr>`).join('')}</table></div>`:''}`;
 if(m.length){$('#go').onclick=()=>runQuiz({title:'À revoir',qs:shuffle(m).slice(0,20),back:P.weak});$('#clr').onclick=()=>{S.misses=[];save();P.weak();badge()}}};
P.export=()=>{const data=JSON.stringify({chapter:CFG.chapter,events:S.all});view().innerHTML=`${head('Export','Progress report','Use this only if a parent asks you to send your results. Copy the text below.')}<div class="card"><textarea id="ex" readonly style="width:100%;height:160px;font:12px monospace;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px">${esc(data)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="cp">Copy</button><span id="cm" style="color:var(--ink2)"></span></div></div>`;$('#cp').onclick=()=>{const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value).then(()=>$('#cm').textContent='Copied.',()=>$('#cm').textContent='Press Ctrl+C to copy.')}catch(e){$('#cm').textContent='Press Ctrl+C to copy.'}}};
function route(){document.onkeydown=null;const h=(location.hash||'#home').slice(1);(P[h]||P.home)();badge();window.scrollTo(0,0);const n=$('#note');if(n)n.hidden=!CFG.endpoint}
addEventListener('hashchange',route);route();
</script>

</body></html>
